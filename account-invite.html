<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account invitation · Payvexis</title>
  <link rel="stylesheet" href="tailwind/output.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-6">
  <main class="glass-card max-w-md w-full p-8 rounded-2xl">
    <a href="index.html" class="text-accent font-bold">Payvexis</a>
    <h1 class="text-2xl font-bold mt-5">Join a shared account</h1>
    <p class="text-sm text-slate-400 mt-3">Sign in with the invited email and verify it before accepting. Account access is a demo workflow.</p>
    <p id="invite-message" class="text-slate-300 mt-5" role="status"></p>
    <button id="accept-invite" class="btn-primary mt-6 w-full justify-center" type="button">Accept invitation</button>
    <a href="login.html" class="text-accent text-sm inline-block mt-5">Sign in</a>
  </main>
  <script src="account-invite.js"></script>
</body>
</html>
